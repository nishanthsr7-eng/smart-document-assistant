name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  TORCH_VERSION: "2.14.0"
  TORCHVISION_VERSION: "0.29.0"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sda
          POSTGRES_PASSWORD: sda
          POSTGRES_DB: sda
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sda"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sda:sda@127.0.0.1:5433/sda
      REDIS_URL: redis://127.0.0.1:6380/0
      S3_ENDPOINT: http://127.0.0.1:9002
      S3_BUCKET: sda-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-only-not-a-real-secret
      LLM_PROVIDER: ollama
      # Without it the operator endpoints answer 503 by design, which the schema fuzz reports
      # as a server error.
      OPERATOR_TOKEN: ci-only-not-a-real-token
    steps:
      - uses: actions/checkout@v5

      # SeaweedFS needs a mounted identities file, which service containers cannot provide.
      - name: Start object store
        run: |
          docker run -d --name objectstore -p 9002:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:9002/status && exit 0
            sleep 2
          done
          docker logs objectstore
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}"
          pip install -r requirements-dev.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/models
          key: models-${{ hashFiles('src/core/config.py') }}

      - run: ruff check .
      - run: mypy src
      - run: alembic upgrade head
      - run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=75
      # Its own process: see the note in pyproject.toml.
      - run: pytest -q tests/test_openapi_contract.py

  # Quality gate. Runs the golden set against the retrieval profile in evaluation/thresholds.yaml
  # and fails the PR on a breach. No API key exists here, so generation is not exercised
  # (LLM_PROVIDER=none): this gates ranking, context assembly and the abstain gate. The
  # generation profile needs a provider and is run by hand (see the README).
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sda
          POSTGRES_PASSWORD: sda
          POSTGRES_DB: sda
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sda"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sda:sda@127.0.0.1:5433/sda
      REDIS_URL: redis://127.0.0.1:6380/0
      S3_ENDPOINT: http://127.0.0.1:9002
      S3_BUCKET: sda-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-only-not-a-real-secret
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v5

      - name: Start object store
        run: |
          docker run -d --name objectstore -p 9002:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:9002/status && exit 0
            sleep 2
          done
          docker logs objectstore
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}"
          pip install -r requirements.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/models
          key: models-${{ hashFiles('src/core/config.py') }}

      - run: alembic upgrade head
      - name: Eval gate
        run: python -m evaluation.run_eval --gate retrieval

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate
          path: evaluation/results/gate_retrieval.*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # checkJs against the @types/react the app already depends on: a misspelled prop or a
      # call with the wrong arity fails here rather than in someone's browser.
      - run: npm run typecheck
      - run: npm test
      # `build` runs the bundle-size check, so a dependency that doubles the first load fails
      # the PR that added it instead of being noticed a release later.
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.9.0
      # torch resolves from the CPU index, which pip-audit does not query.
      - run: pip-audit -r requirements.txt --index-url https://pypi.org/simple --strict
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The frontend is pinned to exact versions and installed from the lockfile, so this audits
      # the tree that actually ships rather than whatever the ranges resolve to today.
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/sda --set secrets.JWT_SECRET=lint
      - run: helm template sda deploy/helm/sda --set secrets.JWT_SECRET=lint > /dev/null

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend.Dockerfile
          - name: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: sda-${{ matrix.name }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Optional: an anonymous weight pull from a shared runner address is rate limited.
          secrets: hf_token=${{ secrets.HF_TOKEN }}
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sda-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
