name: restore-drill

# An untested backup is not a backup, so this runs the drill on a schedule against ephemeral
# services: ingest a corpus, back it up, destroy both stores, restore, and assert the corpus is
# queryable again. Weekly rather than per-PR because nothing in a normal change affects it and
# it is the kind of thing that rots quietly -- a schema migration that a restore cannot replay
# will fail here on the Monday after it lands, not the morning someone needs a recovery.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # Changing the backup code, the schema, or the storage layer is the one change that can break
  # a restore, so those PRs run it too.
  pull_request:
    paths:
      - "deploy/backup/**"
      - "migrations/**"
      - "src/storage/**"
      - ".github/workflows/restore-drill.yml"

env:
  PYTHON_VERSION: "3.10"

jobs:
  drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sda
          POSTGRES_PASSWORD: sda
          POSTGRES_DB: sda
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sda"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sda:sda@127.0.0.1:5433/sda
      REDIS_URL: redis://127.0.0.1:6380/0
      S3_ENDPOINT: http://127.0.0.1:9002
      S3_BUCKET: sda-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-only-not-a-real-secret
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v5

      - name: Start object store
        run: |
          docker run -d --name objectstore -p 9002:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:9002/status && exit 0
            sleep 2
          done
          docker logs objectstore
          exit 1

      # The drill shells out to pg_dump and pg_restore, and they must match the server major
      # version -- an older client cannot read a newer dump format.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Storage and the CLI only: the drill never embeds or generates, so the model stack and
      # its multi-gigabyte download are not needed to prove a restore.
      - run: pip install sqlalchemy psycopg[binary] pgvector boto3 redis alembic pydantic pydantic-settings python-dotenv

      - run: alembic upgrade head

      - name: Seed a corpus to restore
        run: python deploy/backup/seed_drill_corpus.py

      - name: Back up, destroy, restore, verify
        run: python -m deploy.backup.backup drill --into "${RUNNER_TEMP}/drill"
