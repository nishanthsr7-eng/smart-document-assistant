apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sda.fullname" . }}-api
  labels: {{- include "sda.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "sda.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $.Values.observability.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "sda.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "sda.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          securityContext: {{- include "sda.containerSecurityContext" . | nindent 12 }}
          {{- include "sda.backendEnv" . | nindent 10 }}
          env:
            - name: API_WORKERS
              value: {{ .Values.api.workers | quote }}
          ports:
            - name: http
              containerPort: 8000
          # /livez is static; /health pings the backends behind a 10s memo. Neither
          # constructs a model or calls the provider.
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            # Tighter than the liveness probe on purpose: this is how fast the service stops
            # routing to a replica that has begun draining, and the preStop sleep below has to
            # cover period x failureThreshold.
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and SIGTERM are dispatched together, and SIGTERM usually
                # wins. This sleep runs before SIGTERM and gives endpoint propagation the head
                # start, so the last requests routed here are answered rather than refused.
                # The API reports unready for the whole of it -- see _drain_on_signal.
                command: ["sleep", {{ .Values.api.preStopDrainSeconds | quote }}]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
