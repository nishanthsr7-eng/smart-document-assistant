apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sda.fullname" . }}-config
  labels: {{- include "sda.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  INGEST_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
