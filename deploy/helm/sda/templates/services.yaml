apiVersion: v1
kind: Service
metadata:
  name: {{ include "sda.fullname" . }}-api
  labels:
    {{- include "sda.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: sda-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8000, targetPort: http}
    # The API serves /metrics on its own port; `metrics` is the name the ServiceMonitor scrapes.
    - {name: metrics, port: 8001, targetPort: http}
---
# The worker has no HTTP API, only a scrape endpoint, so this Service exists for monitoring.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sda.fullname" . }}-worker
  labels:
    {{- include "sda.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: sda-metrics
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sda.fullname" . }}-frontend
  labels: {{- include "sda.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
