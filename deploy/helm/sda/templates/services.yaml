apiVersion: v1
kind: Service
metadata:
  name: {{ include "sda.fullname" . }}-api
  labels: {{- include "sda.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sda.fullname" . }}-frontend
  labels: {{- include "sda.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
