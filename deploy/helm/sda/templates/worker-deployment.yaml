apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sda.fullname" . }}-worker
  labels: {{- include "sda.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "sda.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $.Values.observability.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "sda.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "sda.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext: {{- include "sda.containerSecurityContext" . | nindent 12 }}
          {{- include "sda.backendEnv" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9100
          # arq writes a heartbeat key; a worker that stops consuming stops refreshing it.
          livenessProbe:
            exec:
              command: ["python", "-m", "arq", "src.ingestion.worker.WorkerSettings", "--check"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # huggingface_hub locks before reading a baked-in model, and docling and matplotlib
            # write into the home cache. Scratch, on a read-only root filesystem.
            - name: hf-locks
              mountPath: /app/data/models/hf/.locks
            - name: home
              mountPath: /home/sda
      volumes:
        - name: tmp
          emptyDir: {}
        - name: hf-locks
          emptyDir: {}
        - name: home
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
