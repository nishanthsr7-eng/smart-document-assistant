# The API and the worker run the same image and scale independently: the API is IO-bound and
# cheap, the worker is CPU-bound and holds the model weights during a parse.
image:
  repository: ghcr.io/example/sda-backend
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

frontendImage:
  repository: ghcr.io/example/sda-frontend
  tag: ""
  pullPolicy: IfNotPresent

teiImage:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: cpu-1.8     # use a CUDA tag (e.g. 1.8) on a GPU node pool
  pullPolicy: IfNotPresent

imagePullSecrets: []

api:
  replicas: 3
  workers: 4       # uvicorn workers per pod
  resources:
    requests: {cpu: "500m", memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  # SSE answer streams must finish; the API drains before the pod goes away. The budget is
  # preStopDrainSeconds (endpoints propagate, replica reports unready) plus the longest answer
  # still in flight (QUERY_TIMEOUT_S), which is what uvicorn's --timeout-graceful-shutdown
  # waits for.
  terminationGracePeriodSeconds: 220
  # Must exceed readinessProbe.periodSeconds x failureThreshold, or the service is still
  # routing here when uvicorn stops accepting.
  preStopDrainSeconds: 15

worker:
  replicas: 2
  concurrency: 1   # jobs in flight per worker process
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # A 200-page PDF parse must not be torn out from under the job.
  terminationGracePeriodSeconds: 960

frontend:
  replicas: 2
  resources:
    requests: {cpu: "10m", memory: 32Mi}
    limits: {cpu: "200m", memory: 128Mi}

# Embedding and reranking off the API's own CPU. Disabled means in-process weights, which is
# the single-replica default; enabling either one sets TEI_EMBED_URL / TEI_RERANK_URL on the API
# and the worker, so nothing else in the chart changes. The reranker is the heavier of the two:
# it runs `rerank_candidates x sub-queries` pairs per question against one pair per passage.
tei:
  embed:
    enabled: false
    model: BAAI/bge-base-en-v1.5
    replicas: 2
    maxClientBatchSize: 128
    tag: ""
    extraArgs: []
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 4Gi}
    persistence: {enabled: false, size: 10Gi, storageClass: ""}
    nodeSelector: {}
    tolerations: []
  rerank:
    enabled: false
    model: mixedbread-ai/mxbai-rerank-base-v1
    replicas: 2
    maxClientBatchSize: 128
    tag: ""
    extraArgs: []
    resources:
      requests: {cpu: "2", memory: 2Gi}
      limits: {cpu: "4", memory: 4Gi}
    persistence: {enabled: false, size: 10Gi, storageClass: ""}
    nodeSelector: {}
    tolerations: []

# Traces, metrics, logs. Nothing here is required: with no OTLP endpoint and no Langfuse keys the
# pods still record spans and serve /metrics, they just ship nothing outward.
observability:
  otlpEndpoint: ""            # e.g. http://opentelemetry-collector.observability:4318
  traceSampleRatio: "1.0"
  logJson: true
  serviceMonitor:
    enabled: false            # needs the Prometheus Operator CRDs
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  # Secret holding METRICS_TOKEN, when /metrics should not be open inside the cluster.
  metricsTokenSecret: ""
  # Scrape annotations for a Prometheus that discovers pods rather than ServiceMonitors.
  podAnnotations: false

migrations:
  enabled: true    # pre-install/pre-upgrade Job running `alembic upgrade head`

ingress:
  enabled: true
  className: nginx
  host: sda.example.com
  annotations:
    # SSE: no response buffering, and a read timeout longer than a slow answer.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
  tls: []

# Non-secret configuration. Rendered into a ConfigMap and mounted as env.
config:
  DATABASE_URL: postgresql+psycopg://sda:sda@sda-postgres:5432/sda
  REDIS_URL: redis://sda-redis:6379/0
  S3_ENDPOINT: http://sda-objectstore:9000
  S3_BUCKET: sda-documents
  S3_REGION: us-east-1
  LLM_PROVIDER: gemini
  GEMINI_MODEL: gemini-3.6-flash
  # Ordered failover chain after LLM_PROVIDER. Each name needs its own key in the secret, or it
  # trips its breaker on the first call and is skipped from then on.
  LLM_FALLBACK_CHAIN: groq
  LLM_BREAKER_FAILURES: "3"
  LLM_BREAKER_COOLDOWN_S: "60"
  DEPLOY_ENV: production
  LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: sda
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "10"
  ACCESS_TOKEN_TTL_S: "43200"
  # Concurrent answers per API replica, and the wall-clock life of one. The pod's CPU request
  # should cover this many concurrent reranker passes; past the cap /query sheds with a 503.
  QUERY_CONCURRENCY: "8"
  QUERY_TIMEOUT_S: "180"
  # Collection pages and the replay window for an Idempotency-Key.
  API_PAGE_SIZE: "50"
  API_MAX_PAGE_SIZE: "200"
  IDEMPOTENCY_TTL_S: "86400"
  MAX_BULK_FILES: "10"
  # Retention windows. The soft-delete window is how long a delete stays recoverable; the old
  # index window is how long a reindex can be rolled back by pointing the alias back.
  RETENTION_ENABLED: "1"
  RETENTION_SOFT_DELETE_DAYS: "30"
  RETENTION_SUPERSEDED_DAYS: "30"
  RETENTION_OLD_INDEX_DAYS: "7"
  RETENTION_AUDIT_DAYS: "0"
  # Ingest callbacks. A private-address target is refused: a webhook URL is tenant-controlled
  # input that this pod would otherwise fetch with the cluster's own network identity.
  WEBHOOKS_ENABLED: "1"
  WEBHOOKS_MAX_PER_TENANT: "5"
  WEBHOOK_TIMEOUT_S: "5"
  WEBHOOK_MAX_ATTEMPTS: "3"
  WEBHOOK_MAX_FAILURES: "20"
  WEBHOOK_ALLOW_PRIVATE_TARGETS: "0"
  # OCR for PDFs with no text layer. The cap is what keeps an OCR job inside its 900s timeout;
  # raise both together if the worker gets more CPU.
  OCR_ENABLED: "1"
  OCR_MAX_PAGES: "50"
  # Per-tenant limits, shared across replicas through Redis. The rates are sustained per minute
  # and the bursts are how far ahead one tenant may run; auth is limited per client address.
  # Budgets are a hard daily stop on generation spend -- set them before opening a tenant up.
  RATE_LIMIT_ENABLED: "1"
  QUERY_RATE_PER_MINUTE: "30"
  QUERY_BURST: "10"
  INGEST_RATE_PER_MINUTE: "6"
  INGEST_BURST: "3"
  AUTH_RATE_PER_MINUTE: "10"
  AUTH_BURST: "5"
  DAILY_TOKEN_QUOTA: "2000000"
  DAILY_COST_USD: "10"

# Secrets. `existingSecret` is the production path: point at a Secret written by an external
# secrets operator and leave `secrets` empty so nothing lands in values or in Helm history.
existingSecret: ""
secrets: {}
  # JWT_SECRET: ""
  # OPERATOR_TOKEN: ""   # required for /admin/*; unset disables those endpoints
  # GEMINI_API_KEY: ""
  # GROQ_API_KEY: ""
  # LANGFUSE_PUBLIC_KEY: ""
  # LANGFUSE_SECRET_KEY: ""
  # SENTRY_DSN: ""
  # S3_ACCESS_KEY: ""
  # S3_SECRET_KEY: ""

nodeSelector: {}
tolerations: []
affinity: {}
