global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API aggregates its uvicorn workers through PROMETHEUS_MULTIPROC_DIR, so one scrape
  # per pod returns the pod's totals.
  - job_name: sda-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  # The ingest worker has no HTTP server of its own and exposes its own port instead.
  - job_name: sda-worker
    static_configs:
      - targets: ["worker:9100"]

  # The documented dev loop runs the API and the worker on the host, not in the app profile.
  # These two targets read as down when only the containerized stack is up, and vice versa.
  - job_name: sda-dev
    static_configs:
      - targets: ["host.docker.internal:8000", "host.docker.internal:9100"]
