services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sda
      POSTGRES_PASSWORD: sda
      POSTGRES_DB: sda
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sda"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object store. SeaweedFS rather than MinIO: MinIO's public container
  # images are no longer pullable from Docker Hub or quay.io without a subscription.
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9002:8333"
    volumes:
      - objectdata:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # /status over IPv4: the S3 root answers 403 without credentials, and "localhost"
      # resolves to ::1, which the S3 listener is not bound to.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The application itself. Held behind a profile so the documented dev loop
  # (`docker compose up -d` for shared state, code on the host) is unchanged.
  # Whole stack in containers: `docker compose --profile app up -d --build`.
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: sda-backend:dev
    command: ["migrate"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://sda:sda@postgres:5432/sda
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      S3_BUCKET: sda-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # LLM_PROVIDER=ollama only: the server runs on the host, not in this network.
      OLLAMA_HOST: host.docker.internal:11435
      # Empty means in-process weights. With the tei profile up:
      # TEI_EMBED_URL=http://tei-embed:80 TEI_RERANK_URL=http://tei-rerank:80 docker compose       #   --profile app --profile tei up -d
      TEI_EMBED_URL: ${TEI_EMBED_URL:-}
      TEI_RERANK_URL: ${TEI_RERANK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: sda-backend:dev
    command: ["api"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
      API_WORKERS: "4"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/livez')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: sda-backend:dev
    command: ["worker"]
    expose:
      - "9100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: sda-frontend:dev
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8080:8080"
    depends_on:
      - api

  # Embedding and reranking as their own service: `docker compose --profile tei up -d`, then
  # point the API and worker at it with TEI_EMBED_URL=http://127.0.0.1:8081 and
  # TEI_RERANK_URL=http://127.0.0.1:8082 (host) or http://tei-embed:80 / http://tei-rerank:80
  # (in the app profile). The models are the same ones the in-process backend loads, so the
  # score scale -- and therefore every tuned threshold -- is unchanged.
  tei-embed:
    profiles: ["tei"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "BAAI/bge-base-en-v1.5", "--max-client-batch-size", "128"]
    volumes:
      - teidata:/data
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 40

  tei-rerank:
    profiles: ["tei"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "mixedbread-ai/mxbai-rerank-base-v1", "--max-client-batch-size", "128"]
    volumes:
      - teidata:/data
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 40

  # Somewhere for the traces and metrics to land: `docker compose --profile obs up -d`.
  # Point the app at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 (in containers) or
  # http://127.0.0.1:4318 (running the API on the host).
  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # One source of truth for the alerts: the Helm chart renders the same file.
      - ./deploy/helm/sda/files/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/observability/grafana/sda-overview.json:/etc/grafana/provisioning/dashboards/sda-overview.json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  objectdata:
  teidata:
