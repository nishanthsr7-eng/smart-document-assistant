# type in {lookup, table, exact_term, paraphrase, multi_doc, conflict, unanswerable, injection}
- id: lp-01
  question: How many hours of sick leave does a full-time employee accrue for each 80-hour biweekly pay period?
  answerable: true
  type: lookup
  expected:
    - {filename: leave_policy.pdf, page: 10, must_contain: "4 hours"}

