    - {filename: leave_policy.pdf, page: 8, must_contain: "part-time"}

# --- cross_doc_conflict: the documents genuinely disagree, and both belong in the answer -----
- id: xdoc-01
  question: How many weeks of family and medical leave are available, comparing the Federal FMLA entitlement with the contractor extended absence benefit?
  answerable: true
  type: cross_doc_conflict
  expected:
    - {filename: employee_handbook.pdf, page: 7, must_contain: "12 weeks"}
    - {filename: contractor_handbook.txt, page: 1, must_contain: "10 weeks"}

- id: xdoc-02
  question: Compare the bereavement sick leave cap for a Federal employee with the bereavement cap in the state leave supplement.
  answerable: true
  type: cross_doc_conflict
  expected:
    - {filename: employee_handbook.pdf, page: 6, must_contain: "104 hours"}
    - {filename: state_leave_supplement.txt, page: 1, must_contain: "40 hours"}

- id: xdoc-03
  question: How many days of service define a special Government employee under the ethics regulation, and how many define an intermittent advisor under the ethics guidance addendum?
  answerable: true
  type: cross_doc_conflict
  expected:
    - {filename: company_policy.txt, page: 1, must_contain: "130 days"}
    - {filename: ethics_guidance_addendum.txt, page: 1, must_contain: "60 days"}
