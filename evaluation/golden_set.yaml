# type in {lookup, table, exact_term, paraphrase, multi_doc, conflict, unanswerable, injection,
#          scope, hard_negative, multi_hop, cross_doc_conflict}
#
# The first 33 items (through inj-02) are scored against the three documents in data/sample_docs.
# Everything below them additionally depends on the distractor corpus in evaluation/data/corpus/,
# which states near-miss numbers for populations the question is not about. The four types added
# with it are the ones the original set could not express:
#
#   scope              -- the corpus contains a competing number for a different population, and
#                         the question names the governing one. Ranking has somewhere wrong to go.
#   hard_negative      -- the topic is covered; the specific fact is stated nowhere. Refusing an
#                         absent 401(k) policy is easy, refusing an absent carryover ceiling in a
#                         document whose table of contents names "Annual Leave Ceilings" is not.
#   multi_hop          -- the answer requires chaining two facts; neither passage alone contains it.
#   cross_doc_conflict -- two documents genuinely disagree, and both belong in the answer.
- id: lp-01
  question: How many hours of sick leave does a full-time employee accrue for each 80-hour biweekly pay period?
  answerable: true
  type: lookup
  expected:
    - {filename: leave_policy.pdf, page: 10, must_contain: "4 hours"}

