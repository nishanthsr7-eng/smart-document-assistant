[mypy]
python_version = 3.10
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
# Without it, every BaseSettings field that only the environment supplies reads as a missing
# constructor argument at the one place the settings are built.
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = true

[mypy-evaluation.*]
ignore_errors = true
