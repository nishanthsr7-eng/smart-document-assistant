[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-document-assistant"
version = "1.0.0"
description = "RAG service: cited answers with calibrated confidence over uploaded PDF and TXT documents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Exact pins stay in requirements.txt, which the image and CI install from; this reads them.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# `UP` (pyupgrade) is deliberately out: enabling it here would turn the CI commit into a
# repo-wide `Optional[X]` -> `X | None` rewrite. Worth doing, separately.
select = ["E", "F", "I", "B", "C4", "SIM", "T20"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Operator CLIs: their output is the interface, so printing is the point.
"evaluation/*" = ["T20"]
"deploy/backup/*" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
# Without it, every BaseSettings field that only the environment supplies reads as a missing
# constructor argument at the one place the settings are built.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "evaluation.*"
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true

[tool.pytest.ini_options]
# The schema fuzz is collected separately, not because it is slow but because importing
# schemathesis installs a pytest plugin that wraps every item in the session; with it loaded, the
# span-recording and semaphore-accounting tests in test_observability.py and test_api.py fail on
# state that is not theirs. Running it in its own process costs one CI step and keeps both honest.
# CI runs: pytest -q  then  pytest -q tests/test_openapi_contract.py
addopts = "--ignore=tests/test_openapi_contract.py"
testpaths = ["tests"]
